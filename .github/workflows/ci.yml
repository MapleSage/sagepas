name: SagePAS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sagepas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-api:
    name: Rust API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --check
      - run: cargo check --locked -p api
      - run: cargo test --locked -p api

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  hubspot-components:
    name: HubSpot components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/app/cards/package-lock.json
            src/app/settings/package-lock.json
      - name: Install card dependencies
        working-directory: src/app/cards
        run: npm ci
      - name: Validate cards
        working-directory: src/app/cards
        run: npm run lint && npm run format:check
      - name: Install settings dependencies
        working-directory: src/app/settings
        run: npm ci
      - name: Validate settings
        working-directory: src/app/settings
        run: npm run lint && npm run format:check
      - name: Test endpoint function contract
        run: node --test src/app/functions/SagePasSync.test.js
