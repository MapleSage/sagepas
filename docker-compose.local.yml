version: '3.8'

# Local, single-machine deployment of sagepas. The real app, real auth,
# real Postgres schema -- not a mock. Images are built locally
# (docker build -t sagepas-api:demo / sagepas-web:demo -- see CLAUDE.md),
# not pulled from ACR: sageinsureacr6a05ef1f was deleted along with the
# rest of sageinsure-rg in the 2026-09-06 teardown, so registry references
# no longer resolve.
#
# AZURE_OPENAI_ENDPOINT / CONTENT_UNDERSTANDING_ENDPOINT below point at
# resources that were also deleted in that teardown. Everything that reads
# already-stored data (job queues, trace views, policy/quote/claim
# records) works fully against local Postgres. Anything that calls out to
# those two endpoints live (new document extraction, new chat completions)
# will fail until a real AI Foundry endpoint is substituted -- that's
# expected, not a bug to route around here.
#
# DEV_LOCAL_AUTH_ENABLED=true enables the backend's HS256 dev-local login
# path (POST /api/v1/auth/register, /login) for API-level testing --
# curl/scripts can get a token this way. The frontend has no UI for it by
# design (LoginGate only offers "Sign in with Microsoft") -- real staff/
# consumer sign-in through Entra is the only way into the actual app, and
# that's intentional, not a gap to fill in.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sagepas
      POSTGRES_PASSWORD: sagepas_local_dev
      POSTGRES_DB: sagepas
    ports:
      - "5433:5432"
    volumes:
      - sagepas_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagepas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sagepas-api:
    image: sagepas-api:demo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: development
      RUST_LOG: "info,api=debug,infra=debug,rating=debug"
      DATABASE_URL: "postgres://sagepas:sagepas_local_dev@postgres:5432/sagepas"
      REDIS_URL: "redis://redis:6379"
      DEV_LOCAL_AUTH_ENABLED: "true"
      AZURE_ENTRA_AUDIENCE: "api://d1ba82a8-a4e3-4f52-ab5f-2aa8ebee98e1"
      AZURE_ENTRA_TENANT_ID: "e9394f90-446d-41dd-8c8c-98ac08c5f090"
      AZURE_OPENAI_DEPLOYMENT: "gpt-5.6-luna"
      AZURE_OPENAI_ENDPOINT: "https://sageinsure-general-insu-resource.cognitiveservices.azure.com"
      CONTENT_UNDERSTANDING_ENDPOINT: "https://aicu-azdockmgmt5ppjq.cognitiveservices.azure.com"
      CONTENT_UNDERSTANDING_TIMEOUT_SECS: "120"
      HUBSPOT_BRIDGE_URL: "https://51752298.hs-sites.com/hs/serverless/api/sagepas-sync"
      STORAGE_ACCOUNT_NAME: "saopenclaw1701cid"
      STORAGE_CONTAINER_NAME: "sagepas-documents"
    env_file:
      - ./.env.local.secrets

  web:
    image: sagepas-web:demo
    depends_on:
      - sagepas-api
    ports:
      - "8090:8080"

volumes:
  sagepas_local_pg:
