apiVersion: v1
kind: Namespace
metadata:
  name: sagepas

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sagepas
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: sagepas }
            - { name: POSTGRES_PASSWORD, value: sagepas_local_dev }
            - { name: POSTGRES_DB, value: sagepas }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "sagepas"] }
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sagepas
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sagepas
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sagepas
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagepas-api
  namespace: sagepas
spec:
  replicas: 1
  selector:
    matchLabels: { app: sagepas-api }
  template:
    metadata:
      labels: { app: sagepas-api }
    spec:
      containers:
        - name: sagepas-api
          image: sagepas-api:20260829-migrations-fixed
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: PORT, value: "3000" }
            - { name: NODE_ENV, value: development }
            - { name: RUST_LOG, value: "info,api=debug,infra=debug,rating=debug" }
            - { name: DATABASE_URL, value: "postgres://sagepas:sagepas_local_dev@postgres:5432/sagepas" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: DEV_LOCAL_AUTH_ENABLED, value: "true" }
            - { name: AZURE_ENTRA_AUDIENCE, value: "api://d1ba82a8-a4e3-4f52-ab5f-2aa8ebee98e1" }
            - { name: AZURE_ENTRA_TENANT_ID, value: "e9394f90-446d-41dd-8c8c-98ac08c5f090" }
            - { name: STORAGE_ACCOUNT_NAME, value: "saopenclaw1701cid" }
            - { name: STORAGE_CONTAINER_NAME, value: "sagepas-documents" }
          envFrom:
            - secretRef: { name: sagepas-local-secrets, optional: true }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sagepas-api
  namespace: sagepas
spec:
  selector: { app: sagepas-api }
  ports: [{ port: 3000, targetPort: 3000 }]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagepas-web
  namespace: sagepas
spec:
  replicas: 1
  selector:
    matchLabels: { app: sagepas-web }
  template:
    metadata:
      labels: { app: sagepas-web }
    spec:
      containers:
        - name: sagepas-web
          image: sagepas-web:20260829-full
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: sagepas-web
  namespace: sagepas
spec:
  selector: { app: sagepas-web }
  ports: [{ port: 8080, targetPort: 8080 }]

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sagepas
  namespace: sagepas
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sagepas-web, port: { number: 8080 } }
